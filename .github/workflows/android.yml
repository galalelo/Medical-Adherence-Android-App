name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'MedicalAdherence_Android_Safety_Changes/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'MedicalAdherence_Android_Safety_Changes/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and build Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MedicalAdherence_Android_Safety_Changes
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Firebase configuration
        run: test -f app/google-services.json

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medical-adherence-debug-apk
          path: MedicalAdherence_Android_Safety_Changes/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medical-adherence-test-reports
          path: MedicalAdherence_Android_Safety_Changes/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
