[build]
  publish = "MedicalAdherence_Integrated/Website/netlify"

# Firebase client configuration is intentionally loaded by the browser from
# assets/js/firebase-sync.js. No server-side secrets are required by Netlify.

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/dailymed"
  to = "/.netlify/functions/dailymed"
  status = 200
