# Azure DevOps pipeline for the Android app.
# Create an Azure DevOps pipeline pointing at this file to run it.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - MedicalAdherence_Android_Safety_Changes/*
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - MedicalAdherence_Android_Safety_Changes/*
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-latest

variables:
  androidProjectDir: MedicalAdherence_Android_Safety_Changes

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - bash: |
      set -euxo pipefail
      sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
      sdkmanager_path=""
      for candidate in \
        "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" \
        "${sdk_root}/cmdline-tools/bin/sdkmanager" \
        "${sdk_root}/tools/bin/sdkmanager"; do
        if [[ -x "${candidate}" ]]; then
          sdkmanager_path="${candidate}"
          break
        fi
      done
      if [[ -z "${sdkmanager_path}" ]]; then
        echo "##vso[task.logissue type=error]Could not find sdkmanager under ${sdk_root}"
        find "${sdk_root}" -maxdepth 5 -type f -name sdkmanager -print || true
        exit 1
      fi
      echo "Using ${sdkmanager_path}"
      yes | "${sdkmanager_path}" --licenses >/dev/null || true
      "${sdkmanager_path}" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
    displayName: Install Android SDK components
    env:
      ANDROID_SDK_ROOT: $(ANDROID_HOME)

  - task: Gradle@3
    displayName: Run Gradle tests and assemble debug APK
    inputs:
      gradleWrapperFile: '$(androidProjectDir)/gradlew'
      workingDirectory: '$(androidProjectDir)'
      tasks: 'testDebugUnitTest assembleDebug'
      options: '--no-daemon --stacktrace'
      publishJUnitResults: true
      testResultsFiles: '**/app/build/test-results/testDebugUnitTest/TEST-*.xml'
      javaHomeOption: JDKVersion
      jdkVersionOption: '1.17'
      jdkArchitectureOption: x64

  - task: PublishPipelineArtifact@1
    displayName: Publish debug APK
    condition: succeeded()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/$(androidProjectDir)/app/build/outputs/apk/debug'
      artifact: medical-adherence-debug-apk
      publishLocation: pipeline
